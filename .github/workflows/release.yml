name: 发布 npm 包与 GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test - ${{ matrix.os }}
    if: github.event.deleted == false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    steps:
      - name: 检出 tag 对应提交
        uses: actions/checkout@v6
      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.21.1"
          cache: npm
      - name: 安装依赖
        run: npm ci --legacy-peer-deps
      - name: 运行类型检查与测试
        run: npm run check
      - name: 运行包冒烟测试
        run: npm run pack:smoke
      - name: 安装 Pi
        run: npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.2.0
      - name: 运行 Pi 兼容性冒烟测试
        run: npm run compat:pi

  publish_npm:
    name: 校验并发布 npm 包
    if: github.event.deleted == false
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 检出 tag 对应提交
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 配置 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: 校验 tag 与包版本
        run: npm run release:validate -- "$GITHUB_REF_NAME"

      - name: 校验发布说明文件
        shell: bash
        run: |
          notes_path="release-notes/${GITHUB_REF_NAME}.md"
          if [[ ! -f "$notes_path" ]]; then
            echo "未找到发布说明文件：$notes_path"
            exit 1
          fi
          if [[ ! -s "$notes_path" ]]; then
            echo "发布说明文件为空：$notes_path"
            exit 1
          fi
          echo "发布说明文件：$notes_path"

      - name: 安装依赖
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: 运行发布前检查
        run: npm run check

      - name: 构建 RPC bridge
        run: npm run build:bridge

      - name: 发布到 npm
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          fi
          unset NPM_TOKEN
          npm publish --ignore-scripts --access public --provenance

  create_github_release:
    name: 创建 GitHub Release
    if: github.event.deleted == false
    needs: publish_npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出 tag 对应提交
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: 创建 Release 并写入发布说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file "release-notes/${GITHUB_REF_NAME}.md" \
            --title "$GITHUB_REF_NAME"
